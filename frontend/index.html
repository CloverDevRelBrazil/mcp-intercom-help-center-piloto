<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clover DevRel - Help Center</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; }
    .header { background: #004400; color: white; padding: 20px; display: flex; align-items: center; gap: 15px; }
    .logo { width: 40px; height: 40px; }
    .container { max-width: 1000px; margin: 20px auto; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; height: 600px; }
    .chat-area { flex: 1; display: flex; flex-direction: column; }
    .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    .message { padding: 12px 16px; border-radius: 8px; max-width: 80%; word-wrap: break-word; }
    .message.user { background: #004400; color: white; align-self: flex-end; }
    .message.assistant { background: #e8e8e8; color: #333; align-self: flex-start; }
    .message.error { background: #ffcccc; color: #cc0000; align-self: flex-start; }
    .message-tool { font-size: 12px; opacity: 0.7; margin-top: 5px; }
    .input-area { padding: 15px; border-top: 1px solid #eee; display: flex; gap: 10px; }
    input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
    button { padding: 10px 20px; background: #004400; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #003300; }
    .login-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .login-box { background: white; padding: 30px; border-radius: 8px; width: 300px; }
    .login-box h2 { margin-bottom: 20px; color: #004400; }
    .login-box input { width: 100%; margin-bottom: 10px; }
    .login-box button { width: 100%; }
    .error-msg { color: #cc0000; font-size: 12px; margin-top: 5px; }
    .user-info { padding: 10px; background: #f0f0f0; font-size: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <svg class="logo" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
      <rect x="8" y="8" width="8" height="8" fill="white"/>
      <rect x="20" y="8" width="8" height="8" fill="white"/>
      <rect x="8" y="20" width="8" height="8" fill="white"/>
      <rect x="20" y="20" width="8" height="8" fill="white"/>
    </svg>
    <h1>Clover DevRel</h1>
    <div style="margin-left: auto; display: flex; gap: 10px;">
      <button id="loginBtn" style="display: none;">Login</button>
      <button id="logoutBtn" style="display: none;">Logout</button>
      <span id="userInfo" style="color: white; font-size: 12px;"></span>
    </div>
  </div>

  <div id="loginModal" class="login-modal">
    <div class="login-box">
      <h2>Autenticação</h2>
      <input id="tokenInput" type="text" placeholder="Cole seu token">
      <button id="submitLoginBtn">Entrar</button>
      <div id="loginError" class="error-msg"></div>
    </div>
  </div>

  <div id="searchInterface" class="container" style="display: none;">
    <div class="chat-area">
      <div id="messagesList" class="messages"></div>
      <div class="input-area">
        <input id="messageInput" type="text" placeholder="Ex: Como integrar com Clover?">
        <button id="submitBtn">Enviar</button>
      </div>
    </div>
  </div>

  <script>
    let accessToken = localStorage.getItem('accessToken');
    const API_URL = window.location.origin;

    const loginModal = document.getElementById('loginModal');
    const searchInterface = document.getElementById('searchInterface');
    const userInfo = document.getElementById('userInfo');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const submitLoginBtn = document.getElementById('submitLoginBtn');
    const tokenInput = document.getElementById('tokenInput');
    const loginError = document.getElementById('loginError');
    const messageInput = document.getElementById('messageInput');
    const messagesList = document.getElementById('messagesList');
    const submitBtn = document.getElementById('submitBtn');

    if (accessToken) {
      showSearchInterface();
    } else {
      showLoginModal();
    }

    loginBtn.addEventListener('click', () => {
      showLoginModal();
      tokenInput.focus();
    });

    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem('accessToken');
      accessToken = null;
      tokenInput.value = '';
      loginError.textContent = '';
      showLoginModal();
    });

    submitLoginBtn.addEventListener('click', async () => {
      const token = tokenInput.value.trim();
      if (!token) {
        loginError.textContent = 'Insira um token';
        return;
      }

      try {
        const response = await fetch(`${API_URL}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });

        if (!response.ok) {
          loginError.textContent = 'Token inválido';
          return;
        }

        const data = await response.json();
        accessToken = data.jwt;
        localStorage.setItem('accessToken', accessToken);
        loginError.textContent = '';
        userInfo.textContent = token;
        
        showSearchInterface();
      } catch (error) {
        loginError.textContent = 'Erro ao autenticar';
      }
    });

    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });

    submitBtn.addEventListener('click', sendMessage);

    async function sendMessage() {
      const message = messageInput.value.trim();
      if (!message) return;

      addMessageToChat('user', message);
      messageInput.value = '';

      try {
        const response = await fetch(`${API_URL}/api/chat`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${accessToken}`
          },
          body: JSON.stringify({ message })
        });

        if (!response.ok) {
          addMessageToChat('error', 'Erro ao processar mensagem');
          return;
        }

        const data = await response.json();
        addMessageToChat('assistant', data.message, data.tool_used);
      } catch (error) {
        addMessageToChat('error', 'Erro ao processar mensagem');
      }
    }

    function addMessageToChat(role, content, tool) {
      const msgEl = document.createElement('div');
      msgEl.className = `message ${role}`;
      
      let html = `<div class="message-content">${escapeHtml(content)}</div>`;
      if (tool) {
        html += `<div class="message-tool">Tool: ${tool}</div>`;
      }
      
      msgEl.innerHTML = html;
      messagesList.appendChild(msgEl);
      messagesList.scrollTop = messagesList.scrollHeight;
    }

    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, (m) => map[m]);
    }

    function showLoginModal() {
      loginModal.style.display = 'flex';
      searchInterface.style.display = 'none';
      userInfo.style.display = 'none';
      loginBtn.style.display = 'none';
      logoutBtn.style.display = 'none';
    }

    function showSearchInterface() {
      loginModal.style.display = 'none';
      searchInterface.style.display = 'flex';
      userInfo.style.display = 'inline-block';
      loginBtn.style.display = 'inline-block';
      logoutBtn.style.display = 'inline-block';
      messageInput.focus();
    }
  </script>
</body>
</html>
